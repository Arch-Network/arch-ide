<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arch IDE</title>
    <!--
      Apply the saved theme synchronously before paint so we never
      flash the wrong palette. This mirrors what `useTheme.ts` does on
      mount; keeping them in sync is critical because Tailwind's
      `darkMode: ["class"]` reads the `.dark` class off `<html>`.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('arch-ide:theme');
          var resolved =
            stored === 'light'
              ? 'light'
              : stored === 'dark'
                ? 'dark'
                : window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light';
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = resolved;
        } catch (_) {
          // Default to dark when storage / matchMedia aren't available.
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Arch Network IDE — build, deploy, and test Bitcoin-native programs in your browser." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
