[package]
name = "arch-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.75"
axum = "0.7.2"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15.0"
http = "1.0.0"
regex = "1.10.2"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.34.0", features = ["full", "process"] }
tower-http = { version = "0.5.0", features = ["compression-br", "cors", "limit"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1.6.1", features = ["v4", "fast-rng"] }
cloud-storage = "0.11.1"
base64 = "0.21.7"
native-tls = "=0.2.11"
socket2 = "0.5"

# IDL extraction for Satellite framework projects. The `build` feature
# enables IdlBuilder, which orchestrates a host-target compile against the
# user's program with `--features idl-build` and returns the typed IDL.
# Pinned to 0.31.6 (matches arch-cli's working version against
# arch-satellite-lang 0.31.5 in the user's synthesized Cargo.toml).
satellite-lang-idl = { version = "0.31.6", features = ["build"] }

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false