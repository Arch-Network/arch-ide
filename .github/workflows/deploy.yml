name: Deploy

# Replaces deploy/aws/deploy_all.sh. Pushing to main builds the compile-server
# image, rolls the existing ECS service, and publishes the frontend that
# ide.arch.network already serves.
#
# Terraform state for this stack is local, so this workflow does not apply it.
# A fresh apply would try to create a second VPC.
#
# The GitHub token is a BuildKit secret for the image build only. It is not
# written into the image and not injected into the ECS task.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-arch-ide
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 590184001652.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: arch-ide-cluster
  ECS_SERVICE: arch-ide-server
  ARCH_NETWORK_GIT: https://github.com/Arch-Network/arch-network
  ARCH_NETWORK_REV: 854713edfae969a86f217c1c1cdc673628faf54d
  # Live CloudFront origin for ide.arch.network. Not a Terraform output.
  FRONTEND_BUCKET: arch-ide-frontend-951b9612
  CLOUDFRONT_DIST_ID: E17A8DKX2WO7JE

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push compile server
        env:
          # Repo secret. The Actions GITHUB_TOKEN cannot read the private
          # arch-network repo, and the org ARCH_NODE_REPO_TOKEN was rejected.
          ARCH_NETWORK_READ_TOKEN: ${{ secrets.ARCH_NETWORK_READ_TOKEN }}
        run: |
          set -euo pipefail
          case "${ARCH_NETWORK_READ_TOKEN}" in
            ghp_*|github_pat_*|gho_*|ghs_*|ghu_*) ;;
            *)
              echo "::error::ARCH_NETWORK_READ_TOKEN must be a GitHub token that can read Arch-Network/arch-network"
              exit 1
              ;;
          esac
          umask 077
          token_file="$RUNNER_TEMP/arch-network-token"
          printf '%s' "$ARCH_NETWORK_READ_TOKEN" > "$token_file"
          GITHUB_TOKEN_FILE="$token_file" ./deploy/aws/build_push.sh
          rm -f "$token_file"
          echo "IMAGE_URI=${ECR_REGISTRY}/arch-ide/rust-server:$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Register task definition and roll the service
        env:
          REGION: ${{ env.AWS_REGION }}
        run: python3 deploy/aws/update_ecs_task_definition.py

      - name: Wait for the service
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
        timeout-minutes: 15

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://ide.arch.network
          # Vite plus Monaco exceeds Node's default heap on the runner.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm ci
          npm run build

      - name: Confirm the frontend target
        run: |
          set -euo pipefail
          alias=$(aws cloudfront get-distribution \
            --id "$CLOUDFRONT_DIST_ID" \
            --query "Distribution.DistributionConfig.Aliases.Items[0]" \
            --output text)
          origin=$(aws cloudfront get-distribution \
            --id "$CLOUDFRONT_DIST_ID" \
            --query "Distribution.DistributionConfig.Origins.Items[?Id=='${FRONTEND_BUCKET}'].DomainName | [0]" \
            --output text)
          if [ "$alias" != "ide.arch.network" ] || [ "$origin" != "${FRONTEND_BUCKET}.s3.us-east-1.amazonaws.com" ]; then
            echo "::error::CloudFront ${CLOUDFRONT_DIST_ID} is not the ide.arch.network origin ${FRONTEND_BUCKET} (alias=${alias} origin=${origin})"
            exit 1
          fi

      - name: Publish frontend
        run: |
          set -euo pipefail
          aws s3 sync frontend/dist/ "s3://${FRONTEND_BUCKET}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --region "$AWS_REGION"
          aws s3 sync frontend/dist/ "s3://${FRONTEND_BUCKET}/" \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --region "$AWS_REGION"
          invalidation=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DIST_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DIST_ID" \
            --id "$invalidation"
